<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a1f2b">
<title>BascatQuiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap">
<style>
/* Editor: barra arriba, preguntas a la izquierda, la pregunta elegida a la derecha (vídeo con sus marcas + formulario).
   Pantalla del staff y móviles: escenario oscuro de pista, cuatro colores con forma para las respuestas. */
:root {
  --bg: #f4f1f1; --surface: #ffffff; --ink: #1f1618; --muted: #6e6064; --line: #e2d8d9; --soft: #f7f3f3;
  --accent: #7a1f2b; --accent-2: #a82c3c; --accent-soft: #f3e2e5; --accent-ink: #fff; --ok: #2d7a4c; --warn: #a65f00; --bad: #c0392b;
  --stage: #140e0f; --stage-2: #211719; --stage-3: #2e2124; --stage-ink: #fbf6f6; --stage-muted: #c4b2b5; --gold: #e2b23a;
  --oA: #d42a3f; --oB: #1f68cc; --oC: #c48600; --oD: #23893a;
  --f: Poppins, "Segoe UI", system-ui, sans-serif; --fb: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141011; --surface: #1d1719; --ink: #f1e8e9; --muted: #a6979a; --line: #34292c; --soft: #191415;
  --accent: #c8465a; --accent-2: #d9596c; --accent-soft: #3a1f25; --accent-ink: #fff; --ok: #5dbd84; --warn: #e0a040; --bad: #ef6a5a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141011; --surface: #1d1719; --ink: #f1e8e9; --muted: #a6979a; --line: #34292c; --soft: #191415;
  --accent: #c8465a; --accent-2: #d9596c; --accent-soft: #3a1f25; --accent-ink: #fff; --ok: #5dbd84; --warn: #e0a040; --bad: #ef6a5a; color-scheme: dark }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--fb) }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3 { margin: 0; font-family: var(--f); font-weight: 700; text-wrap: balance }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
[hidden] { display: none !important }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important } }

/* ── botones y menús ── */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; cursor: pointer; font-weight: 500; line-height: 1.15; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px }
.btn:hover { border-color: var(--muted) }
.btn:disabled { opacity: .45; cursor: default }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600 }
.btn.pri:hover { background: var(--accent-2) }
.btn.sm { padding: 4px 9px; font-size: 13px; border-radius: 7px }
.btn.ghost { background: transparent; border-color: transparent }
.btn.ghost:hover { border-color: var(--line) }
.btn.danger { color: var(--bad) }
.btn.big { font-size: 16px; padding: 9px 18px; font-family: var(--f) }
.btn input[type=file] { display: none }
.menu { position: relative; display: inline-block }
.menu .pop { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.16); padding: 6px; min-width: 250px; max-height: 70vh; overflow: auto }
.menu.right .pop { left: auto; right: 0 }
.menu.open .pop { display: block }
.menu .pop button, .menu .pop label { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px; cursor: pointer }
.menu .pop button:hover, .menu .pop label:hover { background: var(--accent-soft) }
.menu .pop button.cur { font-weight: 700 }
.menu .pop button.qm { flex-direction: column; align-items: flex-start; gap: 0 }
.menu .pop .qmt { font-weight: 600 }
.menu .pop .qms { font-size: 12px }
.menu .pop { min-width: 300px }
.menu .pop input[type=file] { display: none }
.menu .pop hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px }
.menu .pop .cap { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 6px 10px 2px }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25) }
#toast.on { opacity: 1; transform: translate(-50%, 0) }

/* ── editor ── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line) }
.brand { font-family: var(--f); font-weight: 800; font-size: 18px; color: var(--accent); white-space: nowrap; letter-spacing: -.01em }
.brand span { color: var(--ink) }
.top input.title { font-weight: 600; font-size: 16px; border: 1px solid transparent; background: transparent; padding: 5px 8px; border-radius: 8px; min-width: 0; width: min(340px, 50vw) }
.top input.title:hover, .top input.title:focus { border-color: var(--line); background: var(--soft) }
.top select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px }
.grow { flex: 1 }
.app { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: calc(100% - 60px) }
.side { border-right: 1px solid var(--line); background: var(--soft); padding: 12px 10px 40px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.side .hd { display: flex; align-items: center; justify-content: space-between; margin: 2px 4px 0 }
.side .hd h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600 }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px }
.qi { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; user-select: none }
.qi:hover { background: var(--accent-soft) }
.qi.cur { background: var(--surface); border-color: var(--line); box-shadow: inset 3px 0 0 var(--accent) }
.qi.off { opacity: .5 }
.qi .n { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--surface); border: 1px solid var(--line); font-family: var(--f) }
.qi.cur .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.qi .tx { min-width: 0 }
.qi .t1 { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-weight: 600; line-height: 1.3 }
.qi .t2 { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.qi .t2 .w { color: var(--warn); font-weight: 600 }
.qi .acts { display: none; gap: 2px }
.qi:hover .acts, .qi.cur .acts, .qi:focus-within .acts { display: flex }
.qi .acts button { border: 0; background: transparent; cursor: pointer; padding: 3px 5px; border-radius: 6px; color: var(--muted); font-size: 13px }
.qi .acts button:hover { background: var(--line); color: var(--ink) }
.qi.drag-over { box-shadow: inset 0 3px 0 var(--accent) }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 4px }
.mainp { padding: 18px 22px 60px; min-width: 0 }
.empty { max-width: 640px; margin: 8vh auto; text-align: center; padding: 30px 24px; border: 2px dashed var(--line); border-radius: 16px; background: var(--surface) }
.empty h2 { font-size: 22px; margin-bottom: 8px }
.empty p { color: var(--muted); margin: 0 0 18px }
.empty .row { justify-content: center }
.drop.over { border-color: var(--accent); background: var(--accent-soft) }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.qe { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 22px; align-items: start }
@media (max-width: 1100px) { .qe { grid-template-columns: minmax(0, 1fr) } }
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr) } .side { border-right: 0; border-bottom: 1px solid var(--line) } .mainp { padding: 14px 16px 50px } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px }
.vbox { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100% }
.vbox video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000 }
.vbox .nov { position: absolute; inset: 0; display: grid; place-items: center; color: #ddd; text-align: center; padding: 20px }
.vbox .pov { position: absolute; inset: auto 0 0 0; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: linear-gradient(transparent, rgba(0,0,0,.75)) }
.vbox .pov .ptq { grid-column: 1 / -1; color: #fff; font-family: var(--f); font-weight: 700; font-size: 15px; text-shadow: 0 1px 3px #000 }
.vbox .pov .po { color: #fff; border-radius: 7px; padding: 6px 8px; font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center }
.vbox .pov .po svg { width: 14px; height: 14px; fill: #fff; flex: none }
.vbox .pov .po.ok { outline: 3px solid #fff }
.vbox .pov .go { grid-column: 1 / -1; justify-self: end }
.tl { position: relative; height: 44px; margin: 10px 2px 2px; cursor: pointer; touch-action: none }
.tl .tr { position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: var(--line) }
.tl .seg { position: absolute; top: 18px; height: 8px; background: var(--accent-soft); border-radius: 4px }
.tl .seg.b { background: var(--accent) }
.tl .ph { position: absolute; top: 10px; width: 2px; height: 24px; background: var(--ink); margin-left: -1px; pointer-events: none }
.tl .mk { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; cursor: ew-resize; padding: 0 4px }
.tl .mk b { font-size: 10px; font-weight: 700; color: #fff; border-radius: 4px; padding: 0 4px; line-height: 15px; font-family: var(--f) }
.tl .mk i { width: 2px; height: 28px }
.tl .mk.from b, .tl .mk.from i { background: var(--ok) }
.tl .mk.stop b, .tl .mk.stop i { background: var(--accent) }
.tl .mk.to b, .tl .mk.to i { background: var(--muted) }
.ctrls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px }
.ctrls .sep { width: 1px; height: 22px; background: var(--line); margin: 0 3px }
.ctrls .tt { font-size: 12.5px; color: var(--muted) }
.kbd { font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); font-family: var(--fb) }
.clipinfo { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center }
.clipinfo b { color: var(--ink) }
.f { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px }
.f > label, .lab { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.f input[type=text], .f textarea, .f select, .inp { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; width: 100% }
.f textarea { resize: vertical; min-height: 54px }
.f input.qtext { font-size: 16px; font-weight: 600; font-family: var(--f) }
.chips { display: flex; flex-wrap: wrap; gap: 5px }
.chip { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; cursor: pointer }
.chip:hover { border-color: var(--accent); color: var(--accent) }
.opts { display: flex; flex-direction: column; gap: 6px }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 6px; align-items: center }
.opt .sh { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center }
.opt .sh svg { width: 18px; height: 18px; fill: #fff }
.opt input[type=text] { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; width: 100%; min-width: 0 }
.opt .okb { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); white-space: nowrap }
.opt .okb.on { background: var(--ok); border-color: var(--ok); color: #fff }
.opt .x { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px }
.opt .x:hover { background: var(--line) }
.bgA { background: var(--oA) } .bgB { background: var(--oB) } .bgC { background: var(--oC) } .bgD { background: var(--oD) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.ghchip { font-size: 13px; color: var(--ok) }
.ghchip.warn { color: var(--warn) }
.warns { border-radius: 10px; padding: 9px 12px; background: color-mix(in srgb, var(--warn) 12%, var(--surface)); color: var(--warn); font-size: 13px; font-weight: 600 }
.okmsg { border-radius: 10px; padding: 9px 12px; background: color-mix(in srgb, var(--ok) 12%, var(--surface)); color: var(--ok); font-size: 13px; font-weight: 600 }
/* ventanas */
.modal { position: fixed; inset: 0; z-index: 100; background: rgba(15,8,10,.55); display: grid; place-items: center; padding: 16px }
.modal .box { background: var(--surface); color: var(--ink); border-radius: 16px; width: min(760px, 100%); max-height: min(86vh, 900px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.35); min-width: 0 }
.modal .box.wide { width: min(1100px, 100%) }
.modal .mh { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line) }
.modal .mh h2 { font-size: 18px; flex: 1 }
.modal .mb { padding: 14px 18px; overflow: auto; min-height: 0 }
.modal .mf { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap }
.libt details { border-left: 2px solid var(--line); margin: 4px 0 4px 6px; padding-left: 10px }
.libt summary { cursor: pointer; padding: 4px 0; font-weight: 600 }
.libt > details { border-left: 0; margin-left: 0; padding-left: 0 }
.libt > details > summary { font-size: 15px; font-family: var(--f) }
.libt .cl { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px }
.libt .cl:hover { background: var(--accent-soft) }
.libt .cl input { accent-color: var(--accent) }
.libt .cl .d { font-size: 12px; color: var(--muted); margin-left: auto }
.libt .cl.na { opacity: .5 }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; white-space: nowrap }
.tbl th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); position: sticky; top: 0; background: var(--surface) }
.tbl td.c { text-align: center }
.tbl .y { color: var(--ok); font-weight: 700 } .tbl .n { color: var(--bad); font-weight: 700 }
.scrollx { overflow-x: auto }

/* ── pantalla del staff (escenario) ── */
.live { position: fixed; inset: 0; z-index: 60; background: var(--stage); color: var(--stage-ink); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; font-family: var(--f); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
.live .lbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 18px; background: var(--stage-2); border-bottom: 1px solid var(--stage-3) }
.live .lbar .brand { color: #f0c7cd; font-size: 17px }
.live .lbar .brand span { color: var(--stage-ink) }
.live .pill { border-radius: 999px; padding: 4px 12px; background: var(--stage-3); font-weight: 600; font-size: 14px; white-space: nowrap }
.live .pill b { color: var(--gold); letter-spacing: .08em }
.live .pill.conn::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e0a040; margin-right: 7px; vertical-align: 1px }
.live .pill.conn.ok::before { background: #4cc27c } .live .pill.conn.err::before { background: #ef5350 }
.lbtn { border: 1px solid #4a3a3e; background: var(--stage-3); color: var(--stage-ink); border-radius: 10px; padding: 7px 12px; cursor: pointer; font: 600 14px var(--f); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap }
.lbtn:hover { border-color: #8d7378 }
.lbtn.pri { background: #f1f1f1; color: #1b1214; border-color: #f1f1f1 }
.lbtn.pri:hover { background: #fff }
.lbtn.go { font-size: clamp(16px, 1.5vw, 22px); padding: 10px 22px; border-radius: 12px }
.lbtn.pulse { animation: pulse 1.4s ease-in-out infinite }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.45) } 50% { box-shadow: 0 0 0 10px rgba(255,255,255,0) } }
.live .menu .pop { background: var(--stage-2); border-color: var(--stage-3); color: var(--stage-ink) }
.live .menu .pop button:hover { background: var(--stage-3) }
.live .lfoot { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--stage-2); border-top: 1px solid var(--stage-3) }
.live .lfoot .hint2 { color: var(--stage-muted); font: 500 14px var(--fb); flex: 1; min-width: 0 }
.stage { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: clamp(8px, 1.4vh, 16px); padding: clamp(10px, 1.8vh, 22px) clamp(14px, 2vw, 32px); min-height: 0 }
.qhead { display: flex; align-items: center; gap: 14px; min-width: 0 }
.qhead .qn { color: var(--stage-muted); font-weight: 600; font-size: clamp(13px, 1.2vw, 18px); white-space: nowrap }
.qhead .qt { font-size: clamp(20px, 2.6vw, 44px); font-weight: 800; line-height: 1.12; flex: 1; min-width: 0; text-wrap: balance }
.qhead .ctx { color: var(--gold); font-weight: 600; font-size: clamp(13px, 1.25vw, 19px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40% }
.qhead .tag { border-radius: 8px; padding: 3px 10px; background: var(--gold); color: #241a0a; font-weight: 700; font-size: clamp(12px, 1vw, 15px); white-space: nowrap }
.mid { display: grid; grid-template-columns: clamp(90px, 9vw, 150px) minmax(0, 1fr) clamp(90px, 9vw, 150px); gap: clamp(10px, 1.4vw, 24px); align-items: center; min-height: 0; height: 100% }
.vwrap { position: relative; height: 100%; min-height: 0 }
.vwrap video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; border-radius: 14px; display: block }
.vwrap .vmsg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--stage-muted); font-size: clamp(16px, 1.6vw, 24px); padding: 20px }
.vwrap .expl { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(92%, 1100px); background: rgba(16,10,12,.86); border-left: 5px solid var(--gold); border-radius: 10px; padding: 10px 16px; font: 600 clamp(14px, 1.4vw, 22px)/1.3 var(--f); box-shadow: 0 6px 24px rgba(0,0,0,.4) }
.vwrap .flash { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(16,10,12,.8); border-radius: 999px; padding: 6px 18px; font-weight: 700; font-size: clamp(14px, 1.3vw, 20px) }
.ring { position: relative; width: 100%; aspect-ratio: 1; display: grid; place-items: center }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg) }
.ring .v { font-size: clamp(28px, 3.6vw, 60px); font-weight: 800 }
.ring.low .v { color: #ff8a80 }
.cnt { text-align: center }
.cnt .v { font-size: clamp(30px, 3.8vw, 64px); font-weight: 800; line-height: 1 }
.cnt .l { color: var(--stage-muted); font-size: clamp(12px, 1.05vw, 16px); font-weight: 600 }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(6px, 1vh, 12px) clamp(8px, 1vw, 14px) }
.tile { position: relative; overflow: hidden; display: flex; align-items: center; gap: clamp(10px, 1vw, 16px); border-radius: 12px; padding: clamp(10px, 1.6vh, 20px) clamp(12px, 1.3vw, 22px); color: #fff; font-weight: 700; font-size: clamp(16px, 1.9vw, 32px); line-height: 1.15; min-height: clamp(54px, 9vh, 110px); box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); transition: opacity .3s, filter .3s, transform .3s }
.tile svg { width: clamp(22px, 2.2vw, 40px); height: clamp(22px, 2.2vw, 40px); fill: #fff; flex: none; position: relative }
.tile .tt { flex: 1; min-width: 0; position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.25) }
.tile .k { position: relative; font-size: clamp(16px, 1.7vw, 28px); font-weight: 800; display: flex; align-items: center; gap: 8px }
.tile .bar { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,255,255,.18); transition: width .8s cubic-bezier(.2,.8,.2,1) }
.tile.dim { opacity: .28; filter: saturate(.5) }
.tile.ok { box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), 0 0 0 4px #fff; transform: scale(1.015) }
.tile .chk { width: clamp(26px, 2.2vw, 38px); height: clamp(26px, 2.2vw, 38px); border-radius: 50%; background: #fff; display: grid; place-items: center }
.tile .chk svg { fill: none; stroke: #1c7a35; stroke-width: 4; width: 62%; height: 62% }
.panel { position: absolute; inset: 0; background: var(--stage); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: clamp(16px, 3vh, 40px) clamp(16px, 3vw, 48px); overflow: auto }
.lobby { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(18px, 3vw, 56px); align-items: center; width: min(1400px, 100%) }
.lobby .qr { background: #fff; border-radius: 18px; padding: clamp(10px, 1.2vw, 18px); width: clamp(200px, 26vw, 420px); aspect-ratio: 1; display: grid; place-items: center }
.lobby .qr svg, .lobby .qr img { width: 100%; height: 100% }
.lobby .how { font-size: clamp(16px, 1.6vw, 26px); color: var(--stage-muted); font-weight: 600 }
.lobby .url { font-size: clamp(22px, 2.6vw, 44px); font-weight: 800; word-break: break-all }
.lobby .bigcode { font-size: clamp(54px, 7.5vw, 130px); font-weight: 800; letter-spacing: .12em; color: var(--gold); line-height: 1 }
.lobby .np { margin-top: 16px; font-size: clamp(16px, 1.5vw, 24px); font-weight: 700 }
.names { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; max-height: 38vh; overflow: auto }
.names .nm { background: var(--stage-3); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: clamp(14px, 1.3vw, 21px); animation: pop .35s ease-out; cursor: pointer; border: 1px solid transparent }
.names .nm:hover { border-color: #ef5350; text-decoration: line-through }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
.board { width: min(1100px, 100%) }
.board h2 { font-size: clamp(26px, 3.2vw, 54px); text-align: center; margin-bottom: clamp(12px, 2vh, 28px) }
.brow { display: grid; grid-template-columns: clamp(40px, 4vw, 70px) minmax(0, 1fr) auto auto; gap: 14px; align-items: center; background: var(--stage-2); border-radius: 12px; padding: clamp(8px, 1.3vh, 16px) clamp(12px, 1.4vw, 22px); margin-bottom: clamp(6px, 1vh, 12px); font-size: clamp(17px, 2vw, 34px); font-weight: 700; transition: transform .6s cubic-bezier(.2,.8,.2,1) }
.brow .r { color: var(--stage-muted); font-weight: 800 }
.brow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.brow .d { color: #7fd99b; font-size: .7em; font-weight: 700 }
.brow .mv { font-size: .6em; color: var(--stage-muted); width: 2.4em; text-align: right }
.brow .mv.up { color: #7fd99b } .brow .mv.dn { color: #ff8a80 }
.brow.first { background: linear-gradient(90deg, #5b4310, var(--stage-2)) }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: clamp(10px, 2vw, 32px); width: min(1100px, 100%); height: min(62vh, 640px) }
.pod { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0 }
.pod .who { font-size: clamp(18px, 2.4vw, 40px); font-weight: 800; text-align: center; overflow-wrap: anywhere; opacity: 0; transform: translateY(14px); transition: .5s }
.pod .sc { color: var(--stage-muted); font-weight: 700; font-size: clamp(14px, 1.4vw, 22px); margin-bottom: 10px; opacity: 0; transition: .5s .2s }
.pod .blk { width: 100%; border-radius: 14px 14px 0 0; display: grid; place-items: start center; padding-top: 14px; font-size: clamp(40px, 5vw, 90px); font-weight: 800; color: rgba(255,255,255,.92); transform-origin: bottom; transform: scaleY(0); transition: transform .8s cubic-bezier(.2,.8,.2,1) }
.pod.on .who, .pod.on .sc { opacity: 1; transform: none }
.pod.on .blk { transform: scaleY(1) }
.pod.p1 .blk { height: 62%; background: linear-gradient(#d4a52a, #8c6512) }
.pod.p2 .blk { height: 46%; background: linear-gradient(#a9adb5, #5f646c) }
.pod.p3 .blk { height: 34%; background: linear-gradient(#b8763d, #6e401b) }
@media (max-width: 760px) { .lobby { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center } .names { justify-content: center } .mid { grid-template-columns: 70px minmax(0, 1fr) 70px } }

/* ── móvil del jugador ── */
.pl { position: fixed; inset: 0; overflow: auto; background: var(--stage); color: var(--stage-ink); font-family: var(--f); display: flex; flex-direction: column }
.pl .pbar { display: flex; align-items: center; gap: 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--stage-2) }
.pl .pbar .brand { color: #f0c7cd; font-size: 16px }
.pl .pbar .brand span { color: var(--stage-ink) }
.pl .pbar .me { margin-left: auto; font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: center; min-width: 0 }
.pl .pbar .me .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45vw }
.pl .pbar .me .sc { background: var(--stage-3); border-radius: 999px; padding: 2px 10px }
.pl .pbody { flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 14px; min-height: 0 }
.pl .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px }
.pl h1 { font-size: 28px; line-height: 1.15 }
.pl .sub { color: var(--stage-muted); font-size: 16px; font-weight: 500 }
.pl form { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: left }
.pl label { font-size: 13px; font-weight: 600; color: var(--stage-muted); text-transform: uppercase; letter-spacing: .06em }
.pl input { width: 100%; border: 2px solid var(--stage-3); background: var(--stage-2); color: var(--stage-ink); border-radius: 12px; padding: 14px; font: 700 20px var(--f) }
.pl input:focus { border-color: var(--gold); outline: none }
.pl input.code { letter-spacing: .2em; text-transform: uppercase; text-align: center; font-size: 26px }
.pl .pbtn { border: 0; border-radius: 12px; background: #f1f1f1; color: #1b1214; padding: 15px; font: 800 19px var(--f); cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15) }
.pl .pbtn:disabled { opacity: .5 }
.pl .pbtn.ghost { background: transparent; color: var(--stage-muted); box-shadow: none; font-size: 15px; padding: 8px }
.pl .err { color: #ff9e95; font-weight: 600; font-size: 14px; min-height: 1.2em }
.pl .phead { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--stage-muted); font-weight: 600; font-size: 14px }
.pl .ptimer { height: 8px; border-radius: 4px; background: var(--stage-3); overflow: hidden }
.pl .ptimer i { display: block; height: 100%; background: var(--gold); width: 100%; transform-origin: left }
.pl .pq { font-size: 21px; font-weight: 800; line-height: 1.2 }
.pl .pctx { color: var(--gold); font-weight: 600; font-size: 14px }
.ptiles { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 10px; min-height: 260px }
.ptiles.n2 { grid-template-columns: 1fr }
.ptile { border: 0; border-radius: 16px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; font: 700 18px/1.2 var(--f); cursor: pointer; box-shadow: inset 0 -6px 0 rgba(0,0,0,.2); text-align: center; touch-action: manipulation; transition: transform .1s, opacity .2s }
.ptile:active { transform: scale(.97) }
.ptile svg { width: 44px; height: 44px; fill: #fff }
.ptile[disabled] { cursor: default }
.ptile.faded { opacity: .25 }
.big-sh { width: 120px; height: 120px; border-radius: 24px; display: grid; place-items: center; box-shadow: inset 0 -8px 0 rgba(0,0,0,.2) }
.big-sh svg { width: 64px; height: 64px; fill: #fff }
.res { width: 100%; border-radius: 20px; padding: 26px 18px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center }
.res.ok { background: linear-gradient(160deg, #23893a, #155d26) }
.res.ko { background: linear-gradient(160deg, #c22b3e, #7d1726) }
.res.na { background: var(--stage-3) }
.res .big { font-size: 34px; font-weight: 800 }
.res .pts { font-size: 22px; font-weight: 800; background: rgba(0,0,0,.22); border-radius: 999px; padding: 4px 16px }
.res .was { font-size: 16px; font-weight: 600; opacity: .95 }
.rank { font-size: 64px; font-weight: 800; line-height: 1; color: var(--gold) }
.pl .note { color: var(--stage-muted); font: 500 13px var(--fb); text-align: center }
.pl .conn { font: 600 12px var(--fb); color: var(--stage-muted); display: flex; align-items: center; gap: 6px }
.pl .conn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #e0a040 }
.pl .conn.ok::before { background: #4cc27c } .pl .conn.err::before { background: #ef5350 }
.spin { width: 36px; height: 36px; border: 4px solid var(--stage-3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }

    const close = () => { m.remove(); document.removeEventListener('keydown', onk); opt.onClose && opt.onClose(); };
    const onk = e => { if (e.key === 'Escape') close(); };
    m.addEventListener('mousedown', e => { if (e.target === m) close(); });

  function renderAll() { $('#qTitle').value = E.quiz.title; $('#qLang').value = L(); renderList(); renderMain(); }

  function insertAfter(q) { const i = E.quiz.qs.findIndex(x => x.id === E.sel); E.quiz.qs.splice(i < 0 ? E.quiz.qs.length : i + 1, 0, q); save(); select(q.id); }

  // ───────── lista de preguntas ─────────
  function clipLabel(c) { return c ? c.name || 'clip' : 'sin clip'; }

    let n = 0;
    $('#qList').innerHTML = qs.map(q => {
      const pr = BQ.problems(q, q.clip ? !!BQ.resolveClip(q.clip) : null), num = q.on ? ++n : '–';
      return `<li class="qi ${q.id === E.sel ? 'cur' : ''} ${q.on ? '' : 'off'}" data-id="${q.id}" draggable="true">
        <span class="n">${num}</span>

      const id = li.dataset.id;
      li.onclick = e => { const a = e.target.closest('[data-a]'); if (a) { e.stopPropagation(); listAct(id, a.dataset.a); } else if (id !== E.sel) select(id); };
      li.ondragstart = e => { e.dataTransfer.setData('text/x-bqz', id); e.dataTransfer.effectAllowed = 'move'; };
      li.ondragover = e => { if ([...e.dataTransfer.types].includes('text/x-bqz')) { e.preventDefault(); e.stopPropagation(); li.classList.add('drag-over'); } };
      li.ondragleave = () => li.classList.remove('drag-over');
      li.ondrop = e => { const from = e.dataTransfer.getData('text/x-bqz'); if (!from) return; e.preventDefault(); e.stopPropagation(); li.classList.remove('drag-over'); move(from, id); };
    });
  }
  function move(fromId, beforeId) {
    const qs = E.quiz.qs, a = qs.findIndex(q => q.id === fromId); if (a < 0 || fromId === beforeId) return;
    const [x] = qs.splice(a, 1); const b = qs.findIndex(q => q.id === beforeId); qs.splice(b < 0 ? qs.length : b, 0, x); save(); renderList();
  }
  async function listAct(id, a) {
    const qs = E.quiz.qs, i = qs.findIndex(q => q.id === id), q = qs[i]; if (!q) return;
    if (a === 'on') { q.on = !q.on; save(); renderList(); return; }
    if (a === 'up' && i > 0) { qs.splice(i, 1); qs.splice(i - 1, 0, q); }
    else if (a === 'dn' && i < qs.length - 1) { qs.splice(i, 1); qs.splice(i + 1, 0, q); }
    else if (a === 'dup') { const c = BQ.clone(q); c.id = BQ.uid(6); qs.splice(i + 1, 0, c); save(); select(c.id); return; }
    else if (a === 'del') {
      if (!await BQ.ask('Borrar pregunta', `¿Borrar «${q.text || 'pregunta'}» (${clipLabel(q.clip)})?`, 'Borrar', true)) return;
      qs.splice(i, 1); if (E.sel === id) E.sel = (qs[i] || qs[i - 1] || {}).id || null; save(); renderList(); renderMain(); return;
    }
    save(); renderList();
  }

  // ───────── añadir clips ─────────
  function clipFromFile(rec) { return { src: 'file', key: rec.key, name: rec.name, folder: rec.folder || '' }; }
  async function addFiles(list) {
    const vids = list.filter(x => BQ.isVideo(x.path)).sort((a, b) => a.path.localeCompare(b.path, 'es', { numeric: true }));
    if (!vids.length) { BQ.toast('No hay vídeos en lo que has elegido'); return; }
    let added = 0, linked = 0, first = null;
    for (const { path, file } of vids) {
      const rec = BQ.addFile(path, file); BQ.cacheFile(rec);
      // si alguna pregunta ya usa este clip (por ruta o por nombre), solo se vuelve a enlazar
      const users = E.quiz.qs.filter(q => q.clip && (q.clip.key === rec.key || (BQ.norm(q.clip.name) === rec.n && (!q.clip.folder || !rec.folder || BQ.norm(q.clip.folder) === BQ.norm(rec.folder)))));
      if (users.length) { users.forEach(q => { if (q.clip.src !== 'lib' || !q.clip.url) { q.clip.key = rec.key; q.clip.src = 'file'; } }); linked++; continue; }
      const q = BQ.newQuestion(L(), clipFromFile(rec)); E.quiz.qs.push(q); added++; if (!first) first = q.id;
    }
    save(); if (first) E.sel = first; else if (!E.sel && E.quiz.qs[0]) E.sel = E.quiz.qs[0].id;
    renderList(); renderMain();
    BQ.toast([added ? `${added} ${added === 1 ? 'pregunta nueva' : 'preguntas nuevas'}` : '', linked ? `${linked} ${linked === 1 ? 'vídeo enlazado a su pregunta' : 'vídeos enlazados a sus preguntas'}` : ''].filter(Boolean).join(' · '));
  }
  async function openZip(f) {
    BQ.toast('Abriendo el zip…', 60000);
    try {
      const JSZip = await BQ.needZip(), z = await JSZip.loadAsync(f), list = [];
      for (const [p, ent] of Object.entries(z.files)) { if (ent.dir || !BQ.isVideo(p) || /__MACOSX/.test(p)) continue; const b = await ent.async('blob'); list.push({ path: p, file: new File([b], p.split('/').pop(), { type: /\.webm$/i.test(p) ? 'video/webm' : 'video/mp4' }) }); }
      await addFiles(list);
    } catch (err) { BQ.toast('No he podido abrir el zip: ' + err.message); }
  }
  async function readEntry(ent, path, out) {
    if (ent.isFile) { const f = await new Promise((res, rej) => ent.file(res, rej)); out.push({ path: path + f.name, file: f }); }
    else if (ent.isDirectory) { const rd = ent.createReader(); let batch; do { batch = await new Promise((res, rej) => rd.readEntries(res, rej)); for (const e of batch) await readEntry(e, path + ent.name + '/', out); } while (batch.length); }
  }
  async function onDrop(e) {
    if (E.live || !e.dataTransfer || !e.dataTransfer.files.length) return;
    e.preventDefault(); $$('.drop').forEach(d => d.classList.remove('over'));
    const files = [...e.dataTransfer.files];
    const json = files.find(f => /\.json$/i.test(f.name)); if (json) { importQuiz(await json.text(), json.name); return; }
    const zip = files.find(f => /\.zip$/i.test(f.name)); if (zip) { openZip(zip); return; }
    const ents = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean), out = [];
    if (ents.length) { for (const ent of ents) await readEntry(ent, '', out); } else files.forEach(f => out.push({ path: f.name, file: f }));
    addFiles(out);
  }

  // ───────── biblioteca de BascatApp ─────────
  async function tryLibQuiet() { try { await BQ.loadLib(); renderList(); renderMain(); } catch (e) { /* sin biblioteca: se queda con los vídeos del ordenador */ } }
  async function libPicker(mode) {

    const clipRow = c => { const i = k++; all[i] = c; const ok = !!c.url; return `<div class="cl ${ok ? '' : 'na'}">${mode === 'pick' ? `<button class="btn sm" data-pick="${i}" ${ok ? '' : 'disabled'}>Elegir</button>` : `<input type="checkbox" data-c="${i}" ${ok ? '' : 'disabled'} aria-label="${esc(c.name)}">`}<span>${esc(c.name)}</span>${used.has(c.url) || used.has(c.n) ? '<span class="muted" style="font-size:12px">· ya está en el cuestionario</span>' : ''}<span class="d num">${ok ? (c.dur ? Math.round(c.dur) + ' s' : '') : 'solo marca de tiempo'}</span></div>`; };

    const upd = () => { const n = m.querySelectorAll('input[data-c]:checked').length; const b = m.querySelector('#libAdd'); if (b) { b.disabled = !n; b.textContent = n ? `Añadir ${n} ${n === 1 ? 'clip' : 'clips'}` : 'Añadir'; } const s = m.querySelector('#libN'); if (s) s.textContent = n ? `${n} ${n === 1 ? 'clip elegido' : 'clips elegidos'} (una pregunta por clip)` : 'Ninguno elegido'; };

    if (add) add.onclick = () => {
      const cs = [...m.querySelectorAll('input[data-c]:checked')].map(x => all[+x.dataset.c]); let first = null;
      for (const c of cs) { const q = BQ.newQuestion(L(), libClip(c)); if (c.dur) q.clip.dur = c.dur; E.quiz.qs.push(q); if (!first) first = q.id; }
      save(); m.close(); if (first) select(first); BQ.toast(`${cs.length} ${cs.length === 1 ? 'pregunta nueva' : 'preguntas nuevas'}: falta decidir dónde para cada clip y las respuestas`, 5000);
    };
  }
  const libClip = c => ({ src: 'lib', url: c.url, name: c.name, folder: c.folder, lib: c.lib, dur: c.dur || null });

  // ───────── editor de la pregunta ─────────
  let tl = null; // estado de la línea de tiempo
  function renderMain() {
    const main = $('#main'); stopPreview();

  <div class="mid"><div id="lLeft"></div><div class="vwrap"><video id="lv" playsinline preload="auto"></video><div class="vmsg" id="lMsg" hidden></div><div class="flash" id="lFlash" hidden></div><div class="expl" id="lExpl" hidden></div></div><div id="lRight"></div></div>
  <div class="tiles" id="lTiles"></div>
  <div class="panel" id="lPanel" hidden></div>
</div>
<div class="lfoot"><span class="hint2" id="lHint"></span><button class="lbtn" id="lPrev" hidden>Repetir clip</button><button class="lbtn pri go" id="lNext">Siguiente ▶</button></div>`;
    document.body.appendChild(el);
    $('#lNext').onclick = next;
    $('#lPrev').onclick = replay;
    $('#lFs').onclick = fullscreen;
    $('#lSnd').onclick = () => { BQ.setCfg({ sound: !BQ.cfg().sound }); $('#lv').muted = !BQ.cfg().sound; updBar(); };
    const menu = $('#lMenu'); menu.querySelector('.lbtn').onclick = e => { e.stopPropagation(); menu.classList.toggle('open'); };
    el.addEventListener('click', e => { if (!e.target.closest('#lMenu .pop')) menu.classList.remove('open'); });
    menu.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { menu.classList.remove('open'); menuAct(b.dataset.m); });
    document.addEventListener('keydown', onKey);
    connect(); render();
    if (G.ph === 'q') runTimer();
  }
  async function menuAct(a) {
    if (a === 'replay') replay();
    else if (a === 'slow') { slow = !slow; BQ.toast(slow ? 'La respuesta se enseñará a cámara lenta' : 'Velocidad normal'); if (G.ph === 'reveal') playOutcome(); }
    else if (a === 'more') { if (G.ph === 'q') { G.extra += 10; persist(); sendState(); BQ.toast('+10 segundos'); } else BQ.toast('Solo mientras se responde'); }
    else if (a === 'player') window.open(BQ.joinUrl(G.code, G.net), '_blank');
    else if (a === 'copy') { const u = BQ.joinUrl(G.code, G.net); try { await navigator.clipboard.writeText(u); BQ.toast('Enlace copiado'); } catch (e) { BQ.toast(u, 8000); } }
    else if (a === 'end') { if (G.ph === 'end') return; if (await BQ.ask('Terminar la partida', 'Se pasa directamente al podio con los puntos de ahora.', 'Terminar', true)) { if (G.ph === 'q') { clearInterval(tmr); G.ph = 'closed'; scoreQuestion(); } end(); } }
    else if (a === 'exit') { if (G.ph !== 'end' && G.ph !== 'lobby' && !await BQ.ask('Volver al editor', 'La partida queda guardada: al volver a abrir esta página podrás continuarla.', 'Salir')) return; if (G.ph === 'lobby') BQ.store.del('game'); exit(); }
  }
  function replay() {
    const x = q(), v = $('#lv'); if (!x || !v || !v.src || !isFinite(v.duration)) return;
    if (stopSeg) stopSeg();
    if (G.ph === 'play') { stopSeg = BQ.playSeg(v, x.from || 0, x.stop == null ? v.duration : x.stop, 1, () => { if (G && G.ph === 'play' && q() === x) openQ(); }); }
    else if (G.ph === 'reveal' || G.ph === 'closed' || G.ph === 'q') { const stop = x.stop == null ? v.duration : x.stop; stopSeg = BQ.playSeg(v, x.from || 0, G.ph === 'reveal' ? (x.to == null ? v.duration : x.to) : stop, slow ? 0.5 : 1, null); }
  }
  function fullscreen() { const l = $('#live'); if (document.fullscreenElement) document.exitFullscreen().catch(() => { }); else if (l && l.requestFullscreen) l.requestFullscreen().catch(() => BQ.toast('Este navegador no deja poner pantalla completa')); }
  function onKey(e) {
    if (!G || $('.modal')) return; const tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'r' || e.key === 'R') replay();
    else if (e.key === 'f' || e.key === 'F') fullscreen();
  }
  function updBar() {
    if (!G) return; const n = G.order.length;
    $('#lQn').textContent = G.i < 0 ? `${G.qs.length} preguntas` : `Pregunta ${G.i + 1} / ${G.qs.length}`;
    $('#lNp').textContent = `${n} ${n === 1 ? 'jugador' : 'jugadores'}`;
    $('#lSnd').textContent = BQ.cfg().sound ? '🔊 Sonido' : '🔇 Sin sonido';
  }
  const HINT = {
    lobby: 'Los jugadores entran con el QR o el código. Toca un nombre para sacarlo de la partida. Cuando estén todos, empieza.',
    play: 'El clip se para solo en el momento elegido. Siguiente = saltar a la parada.',
    q: 'Respondiendo… Puedes repetir el clip mientras tanto. Se cierra al acabar el tiempo o cuando han respondido todos. Siguiente = cerrar ya.',
    closed: 'Respuestas cerradas. Cuando quieras, enseña la respuesta correcta.',
    reveal: 'Se ve cómo acaba la jugada. Repítelo o comenta, y luego pasa a la clasificación.',
    board: 'Clasificación después de esta pregunta.',
    end: 'Partida terminada.',
  };
  const NEXT = { lobby: 'Empezar ▶', play: 'Saltar a la parada ▶', q: 'Cerrar respuestas', closed: 'Mostrar la respuesta ▶', reveal: 'Clasificación ▶', board: 'Siguiente pregunta ▶', end: 'Ver resultados' };

  function render() {
    if (!G || !$('#live')) return; updBar();
    const x = q(), ph = G.ph;
    $('#lHint').textContent = HINT[ph];
    const nb = $('#lNext'); nb.textContent = ph === 'board' && G.i + 1 >= G.qs.length ? 'Podio ▶' : NEXT[ph]; nb.classList.toggle('pulse', ph === 'closed' || (ph === 'lobby' && G.order.length > 0));

    const panel = $('#lPanel');

    else panel.hidden = true;

    $('#lHead').innerHTML = `<span class="qn num">${esc(T('qn', { i: G.i + 1, n: G.qs.length }))}</span><span class="qt">${esc(x.text)}</span>${x.pts === 2 ? `<span class="tag">${esc(T('double'))}</span>` : x.pts === 0 ? `<span class="tag">${esc(T('noPts'))}</span>` : ''}${x.ctx ? `<span class="ctx">${esc(x.ctx)}</span>` : ''}`;
    const src = BQ.resolveClip(x.clip); const msg = $('#lMsg');
    if (!src) { msg.hidden = false; msg.textContent = x.ctx || T('qn', { i: G.i + 1, n: G.qs.length }); } else if (ph !== 'play') msg.hidden = true;
    const fl = $('#lFlash');
    if (ph === 'play') { fl.hidden = false; fl.textContent = T('watch'); } else if (ph === 'closed') { fl.hidden = false; fl.textContent = T('timeUp'); } else if (ph === 'reveal' && (x.to == null || x.to - (x.stop || 0) > 0.3)) { fl.hidden = false; fl.textContent = T('outcome'); } else fl.hidden = true;
    const ex = $('#lExpl'); ex.hidden = !(ph === 'reveal' && x.expl); ex.textContent = x.expl || '';
    // lados: tiempo y respuestas recibidas
    if (ph === 'q') { $('#lLeft').innerHTML = `<div class="ring" id="lRing"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#3a2c2f" stroke-width="8"/><circle id="lArc" cx="50" cy="50" r="44" fill="none" stroke="#e2b23a" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><span class="v num" id="lSec"></span></div>`; drawRing(G.openAt + (x.lim + G.extra) * 1000 - Date.now(), (x.lim + G.extra) * 1000); }
    else if (ph === 'closed' || ph === 'reveal') $('#lLeft').innerHTML = `<div class="cnt"><div class="v">0</div><div class="l">${esc(T('timeUp'))}</div></div>`;
    else $('#lLeft').innerHTML = '';
    renderCount();
    // respuestas
    if (ph === 'q' || ph === 'closed' || ph === 'reveal') {
      const counts = x.o.map(() => 0); let tot = 0; G.order.forEach(id => { const a = G.players[id].ans[x.id]; if (a) { counts[a.o]++; tot++; } });
      const max = Math.max(1, ...counts);
      $('#lTiles').innerHTML = x.o.map((o, j) => {
        const rev = ph === 'reveal';
        return `<div class="tile bg${BQ.LETTERS[o.i]} ${rev ? (o.ok ? 'ok' : 'dim') : ''}">${rev ? `<span class="bar" style="width:0" data-w="${(100 * counts[j] / max).toFixed(1)}"></span>` : ''}${BQ.SHAPES[o.i]}<span class="tt">${esc(o.t)}</span>${rev ? `<span class="k num">${counts[j]}${o.ok ? `<span class="chk">${CHECK}</span>` : ''}</span>` : ''}</div>`;
      }).join('');
      $('#lTiles').style.gridTemplateColumns = x.o.length <= 2 ? '1fr 1fr' : '';
      if (ph === 'reveal') requestAnimationFrame(() => $$('#lTiles .bar').forEach(b => { b.style.width = b.dataset.w + '%'; }));
    } else $('#lTiles').innerHTML = '';
  }
  function renderCount() {
    const x = q(); if (!x || !$('#lRight')) return;
    if (G.ph === 'q' || G.ph === 'closed' || G.ph === 'reveal') {
      const a = G.order.filter(id => G.players[id].ans[x.id]).length;
      $('#lRight').innerHTML = `<div class="cnt"><div class="v num">${a}</div><div class="l">${esc(T('answers'))}<br>${esc(T('ofN', { n: G.order.length }))}</div></div>`;
    } else $('#lRight').innerHTML = '';
  }
  function drawRing(left, total) {
    const s = $('#lSec'), arc = $('#lArc'), ring = $('#lRing'); if (!s || !arc) return;
    const f = BQ.clamp(left / total, 0, 1); arc.setAttribute('stroke-dashoffset', String(276.5 * (1 - f)));
    s.textContent = Math.max(0, Math.ceil(left / 1000)); ring.classList.toggle('low', left < 5000);
  }
  function qrSvg(text) {
    if (typeof qrcode === 'undefined') return `<div style="color:#000;padding:10px;text-align:center">${esc(text)}</div>`;
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make(); const n = qr.getModuleCount(); let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
    return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="Código QR para entrar"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#140e0f"/></svg>`;
  }
  function renderPanel() {
    const p = $('#lPanel'); if (!p || !G) return;
    if (G.ph === 'lobby') {
      const url = BQ.joinUrl(G.code, G.net), base = BQ.prettyUrl(BQ.joinBase(G.net));
      if (!p.querySelector('.lobby')) p.innerHTML = `<div class="lobby"><div class="qr">${qrSvg(url)}</div><div><div class="how">${esc(T('joinAt'))}</div><div class="url">${esc(base)}</div><div class="how">${esc(T('withCode'))}</div><div class="bigcode">${esc(G.code)}</div><div class="np" id="lNp2"></div><div class="names" id="lNames"></div>${G.net === 'local' ? '<p style="color:var(--gold);font:600 14px var(--fb)">Modo ensayo: solo funciona con pestañas de este navegador.</p>' : ''}</div></div>`;
      const n = G.order.length; $('#lNp2').textContent = n ? `${n} ${n === 1 ? T('player1') : T('players')}` : T('waiting');
      const box = $('#lNames'), have = new Set($$('.nm', box).map(b => b.dataset.p));
      G.order.forEach(id => { if (!have.has(id)) { const b = document.createElement('button'); b.className = 'nm'; b.dataset.p = id; b.title = 'Sacar de la partida'; b.textContent = G.players[id].name; b.onclick = () => kick(id); box.appendChild(b); } });
      $$('.nm', box).forEach(b => { if (!G.players[b.dataset.p]) b.remove(); else b.textContent = G.players[b.dataset.p].name; });
      return;
    }
    if (G.ph === 'board') {
      const ids = rank(), top = ids.slice(0, 5), x = q();
      p.innerHTML = `<div class="board"><h2>${esc(T('board'))}</h2>${top.map(id => { const pl = G.players[id], mv = (pl.prev || pl.rank) - pl.rank, d = pl.last && pl.last.q === x.id ? pl.last.pts : 0; return `<div class="brow ${pl.rank === 1 ? 'first' : ''}"><span class="r num">${pl.rank}</span><span class="nm">${esc(pl.name)}</span><span class="d num">${d ? '+' + BQ.fmtN(d) : ''}</span><span class="num">${BQ.fmtN(pl.score)}<span class="mv ${mv > 0 ? 'up' : mv < 0 ? 'dn' : ''}">${mv > 0 ? '▲' + mv : mv < 0 ? '▼' + (-mv) : ''}</span></span></div>`; }).join('') || `<p class="how">${esc(T('waiting'))}</p>`}
        ${ids.length > 5 ? `<p style="text-align:center;color:var(--stage-muted);font:600 15px var(--fb)">${ids.length - 5} más · cada uno ve su puesto en el móvil</p>` : ''}</div>`;
      return;
    }
    if (G.ph === 'end') {
      const ids = rank(), pod = [ids[1], ids[0], ids[2]];
      p.innerHTML = `<div class="board" style="width:min(1100px,100%)"><h2>${esc(T('podium'))}</h2><div class="podium">${pod.map((id, k) => { const pos = [2, 1, 3][k], pl = id && G.players[id]; return `<div class="pod p${pos}" data-pos="${pos}">${pl ? `<div class="who">${esc(pl.name)}</div><div class="sc num">${BQ.fmtN(pl.score)} ${esc(T('pts'))}</div>` : '<div class="who"></div><div class="sc"></div>'}<div class="blk">${pos}</div></div>`; }).join('')}</div></div>`;
      podT.forEach(clearTimeout); podT = [3, 2, 1].map((pos, k) => setTimeout(() => { const el = p.querySelector(`.pod[data-pos="${pos}"]`); if (el) el.classList.add('on'); }, 400 + k * 1300));
    }
  }
  async function kick(id) {
    const pl = G.players[id]; if (!pl) return;
    if (!await BQ.ask('Sacar de la partida', `¿Sacar a «${pl.name}»? Podrá volver a entrar con otro nombre.`, 'Sacar', true)) return;
    delete G.players[id]; G.order = G.order.filter(x => x !== id); G.ban.push(id); rank(); persist(); sendState(); renderPanel(); updBar();
  }
})();

/* BascatQuiz · móvil del jugador: entrar con el nombre, responder, ver si ha acertado y en qué puesto va */
(function () {
  'use strict';
  const BQ = window.BQ, { $, esc } = BQ;
  const P = BQ.P = {};
  let code = '', net = 'supa', pid = '', name = '', conn = null, st = null, lastSeq = -1, joined = false, shown = '', hiT = 0, seenAt = {}, deadline = {}, mine = {}, resendT = null, gotState = false, wake = null, connState = '', lostT = null;
  const lang = () => (st && st.lang) || BQ.store.get('plang', 'ca');
  const T = (k, v) => BQ.t(lang(), k, v);

  P.boot = (c, n) => {
    code = (c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); net = n || 'supa';
    pid = BQ.store.get('pid', null); if (!pid) { pid = BQ.uid(10); BQ.store.set('pid', pid); }
    name = BQ.store.get('name', '');
    document.title = 'BascatQuiz · ' + (code || 'Entrar');
    $('#app').innerHTML = `<div class="pl"><div class="pbar"><span class="brand">Bascat<span>Quiz</span></span><span class="me" id="pMe"></span></div><div class="pbody" id="pBody"></div><div class="note" style="padding:0 16px calc(12px + env(safe-area-inset-bottom,0px))"><span class="conn" id="pConn" hidden></span></div></div>`;
    const last = BQ.store.get('joined', null);
    if (code && name && last && last.code === code && Date.now() - last.t < 6 * 3600e3) join(); else joinForm();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && joined) { lockScreen(); if (conn && st) sendHi(true); } });
  };

  function joinForm(err) {
    joined = false; shown = 'join';
    $('#pMe').textContent = '';
    $('#pBody').innerHTML = `<div class="center"><h1>${esc(T('join'))}</h1>
      <form id="pForm" autocomplete="off" novalidate>
        <div><label for="pCode">${esc(T('code'))}</label><input id="pCode" class="code" inputmode="text" maxlength="5" autocapitalize="characters" spellcheck="false" value="${esc(code)}"></div>
        <div><label for="pName">${esc(T('name'))}</label><input id="pName" maxlength="18" placeholder="${esc(T('namePh'))}" value="${esc(name)}" autocapitalize="words" spellcheck="false"></div>
        <div class="err" id="pErr">${esc(err || '')}</div>
        <button class="pbtn" type="submit">${esc(T('enter'))}</button></form></div>`;
    const f = $('#pForm'); setTimeout(() => (code ? $('#pName') : $('#pCode')).focus(), 50);
    f.onsubmit = e => {
      e.preventDefault();
      const c = $('#pCode').value.toUpperCase().replace(/[^A-Z0-9]/g, ''), nm = $('#pName').value.replace(/\s+/g, ' ').trim();
      if (c.length !== 5) { $('#pErr').textContent = T('notFound', { c: c || '—' }).split('.')[0]; return; }
      if (!nm) { $('#pErr').textContent = T('nameTaken'); $('#pName').focus(); return; }
      if (c !== code) { code = c; st = null; lastSeq = -1; gotState = false; if (conn) { conn.close(); conn = null; } }
      name = nm; BQ.store.set('name', name); join();
    };
  }
  function join() {
    joined = true; BQ.store.set('joined', { code, t: Date.now() }); lockScreen();
    $('#pMe').innerHTML = `<span class="nm">${esc(name)}</span>`;
    if (!gotState) screen('connecting', `<div class="center"><div class="spin"></div><div class="sub">${esc(T('connecting'))}</div></div>`);
    if (!conn) conn = BQ.net.open(code, net, { status: onStatus, msg: onMsg });
    sendHi(true);
    clearTimeout(lostT); lostT = setTimeout(() => { if (!gotState && joined) screen('nf', `<div class="center"><div class="spin"></div><div class="sub">${esc(T('notFound', { c: code }))}</div><button class="pbtn ghost" id="pBack">${esc(T('otherName'))}</button></div>`, () => { $('#pBack').onclick = () => joinForm(); }); }, 9000);
  }
  async function lockScreen() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wake = await navigator.wakeLock.request('screen'); } catch (e) { wake = null; } }
  function onStatus(s) {
    connState = s; const el = $('#pConn'); if (!el) return;
    el.hidden = s === 'ok' && gotState; el.className = 'conn ' + (s === 'ok' ? 'ok' : 'err'); el.textContent = s === 'ok' ? '' : T('connErr');
    if (s === 'ok') sendHi(true);
  }
  function sendHi(force) { if (!conn || !joined) return; const now = Date.now(); if (!force && now - hiT < 2000) return; hiT = now; conn.send('hi', { p: pid, n: name }); }

  function onMsg(ev, d) {
    if (ev !== 'st' || !d || d.c !== code) return;
    if (typeof d.s === 'number' && d.s <= lastSeq && d.ph === (st && st.ph)) return; lastSeq = d.s;
    st = d; BQ.store.set('plang', d.lang || 'ca');
    if (!gotState) { gotState = true; clearTimeout(lostT); const c = $('#pConn'); if (c && connState === 'ok') c.hidden = true; }
    if (!joined) return;
    if (d.ban && d.ban.includes(pid)) { joined = false; BQ.store.del('joined'); pid = BQ.uid(10); BQ.store.set('pid', pid); screen('ban', `<div class="center"><h1>${esc(T('removed'))}</h1><button class="pbtn" id="pAgain">${esc(T('otherName'))}</button></div>`, () => { $('#pAgain').onclick = () => joinForm(); }); return; }
    const me = d.pl && d.pl[pid];
    if (!me) sendHi();
    $('#pMe').innerHTML = `<span class="nm">${esc(name)}</span>${me && d.ph !== 'lobby' ? `<span class="sc num">${BQ.fmtN(me[0])}</span>` : ''}`;
    const qid = d.q && d.q.id;
    if (qid && d.ph === 'q' && seenAt[qid] == null) { seenAt[qid] = Date.now(); if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) { } }
    if (qid && d.ph === 'q' && typeof d.r === 'number') { const dl = Date.now() + d.r; if (deadline[qid] == null || Math.abs(deadline[qid] - dl) > 1200) deadline[qid] = dl; }
    // respuesta pendiente de confirmar: se reenvía hasta que el staff la tiene
    if (qid && mine[qid] && (d.ph === 'q' || d.ph === 'closed') && !(d.got || []).includes(pid)) resend(qid);

  function resend(qid) { clearTimeout(resendT); resendT = setTimeout(() => { if (st && st.q && st.q.id === qid && (st.ph === 'q' || st.ph === 'closed') && !(st.got || []).includes(pid)) { conn.send('an', { p: pid, q: qid, o: mine[qid].o, ms: mine[qid].ms }); } }, 400); }

  function screen(key, html, after) { if (shown === key) return false; shown = key; $('#pBody').innerHTML = html; if (after) after(); return true; }
  function head(d) { return `<div class="phead"><span class="num">${esc(T('qn', { i: d.i + 1, n: d.n }))}</span>${d.q && d.q.p === 2 ? `<span style="color:var(--gold)">${esc(T('double'))}</span>` : d.q && d.q.p === 0 ? `<span>${esc(T('noPts'))}</span>` : ''}</div>`; }

      screen('lobby' + (me ? 1 : 0), `<div class="center"><h1>${esc(me ? T('in') : T('connecting'))}</h1><div class="big-sh bgB">${BQ.SHAPES[1]}</div><div class="sub">${esc(T('look'))}</div><div class="sub" style="font-size:14px">${esc(T('soon'))}</div><button class="pbtn ghost" id="pRen">${esc(T('otherName'))}</button></div>`, () => { $('#pRen').onclick = () => joinForm(); });

    }
    if (d.ph === 'play') {
      screen('play' + q.id, `${head(d)}<div class="center">${q.c ? `<div class="pctx">${esc(q.c)}</div>` : ''}<div class="pq">${esc(q.x)}</div><div class="sub">${esc(T('watch'))}</div><div class="spin"></div></div>`);
      return;
    }
    if (d.ph === 'q' && !mine[q.id]) {
      if (screen('q' + q.id, `${head(d)}<div class="ptimer"><i id="pBar"></i></div><div class="pq">${esc(q.x)}</div><div class="ptiles ${q.o.length <= 2 ? 'n2' : ''}">${q.o.map((t, j) => `<button class="ptile bg${BQ.LETTERS[q.k[j]]}" data-o="${j}">${BQ.SHAPES[q.k[j]]}<span>${esc(t)}</span></button>`).join('')}</div>`, () => {
        document.querySelectorAll('.ptile').forEach(b => b.onclick = () => answer(q.id, +b.dataset.o));
      })) bar(q.id, q.l);
      return;
    }
    if (d.ph === 'q' || d.ph === 'closed') {
      const a = mine[q.id];
      if (a) screen(d.ph + 'a' + q.id, `${head(d)}<div class="center"><div class="big-sh bg${BQ.LETTERS[q.k[a.o]]}">${BQ.SHAPES[q.k[a.o]]}</div><h1>${esc(d.ph === 'closed' ? T('timeUp') : T('sent'))}</h1><div class="sub">${esc(q.o[a.o])}</div><div class="sub" style="font-size:14px">${esc(T('look'))}</div></div>`);
      else screen('closedn' + q.id, `${head(d)}<div class="center"><h1>${esc(T('timeUp'))}</h1><div class="sub">${esc(T('noAns'))}</div></div>`);
      return;
    }
    if (d.ph === 'reveal' && me) {
      const ok = me[3], pts = me[2], okTxt = (d.ok || []).map(j => q.o[j]).join(' / ');
      screen('rev' + q.id, `${head(d)}<div class="center"><div class="res ${ok === 1 ? 'ok' : ok === 0 ? 'ko' : 'na'}"><div class="big">${esc(ok === 1 ? T('correct') : ok === 0 ? T('wrong') : T('noAns'))}</div>${ok === 1 ? `<div class="pts num">+${BQ.fmtN(pts)}</div>` : ''}${ok !== 1 ? `<div class="was">${esc(T('was'))}: ${esc(okTxt)}</div>` : ''}${me[4] >= 2 ? `<div class="was">${esc(T('streak', { n: me[4] }))}</div>` : ''}</div><div class="sub">${esc(T('total'))}: <b class="num">${BQ.fmtN(me[0])}</b> ${esc(T('pts'))}</div></div>`);
      return;
    }
    if ((d.ph === 'board' || d.ph === 'end') && me) {
      const n = Object.keys(d.pl).length, r = me[1];
      let gap = '';
      if (r > 1) { const above = Object.values(d.pl).find(x => x[1] === r - 1); if (above) gap = T('behind', { d: BQ.fmtN(above[0] - me[0]), r: BQ.ord(lang(), r - 1) }); }
      else gap = d.ph === 'board' ? T('leader') : '';
      const fin = d.ph === 'end';
      screen((fin ? 'end' : 'board') + (q ? q.id : '') + r + me[0], `<div class="center">${fin ? `<h1>${esc(T('over'))}</h1>` : ''}<div class="rank num">${esc(BQ.ord(lang(), r))}</div><h1>${esc(fin ? T('final', { r: BQ.ord(lang(), r), n }) : T('youAre', { r: BQ.ord(lang(), r), n }))}</h1><div class="sub"><b class="num">${BQ.fmtN(me[0])}</b> ${esc(T('pts'))}${gap ? ' · ' + esc(gap) : ''}</div>${fin ? `<div class="sub">${esc(T('thanks'))}</div>` : `<div class="sub" style="font-size:14px">${esc(T('look'))}</div>`}</div>`);
      return;
    }
  }
  function answer(qid, o) {
    if (mine[qid] || !st || st.ph !== 'q' || !st.q || st.q.id !== qid) return;
    const ms = Date.now() - (seenAt[qid] || Date.now());
    mine[qid] = { o, ms };
    if (navigator.vibrate) try { navigator.vibrate(30); } catch (e) { }
    conn.send('an', { p: pid, q: qid, o, ms });
    render(); resend(qid);
    // reintento por si el mensaje se pierde: hasta que aparezca en «got»
    const again = () => { if (st && st.q && st.q.id === qid && (st.ph === 'q' || st.ph === 'closed') && !(st.got || []).includes(pid)) { conn.send('an', { p: pid, q: qid, o, ms }); setTimeout(again, 800); } };
    setTimeout(again, 800);
  }
  function bar(qid, lim) {
    const el = $('#pBar'); if (!el) return;
    const loop = () => {
      const b = $('#pBar'); if (!b || !st || !st.q || st.q.id !== qid || st.ph !== 'q') return;
      const left = (deadline[qid] || Date.now()) - Date.now(), f = BQ.clamp(left / (lim * 1000), 0, 1);
      b.style.transform = `scaleX(${f})`; b.style.background = left < 5000 ? '#ef5350' : '';
      requestAnimationFrame(loop);
    };
    loop();
  }
})();

/* BascatQuiz · arranque: con código en la dirección (#ABCDE) es un móvil de jugador; sin código, el staff prepara y juega */
(function () {
  'use strict';
  const BQ = window.BQ;
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const m = h.match(/^([A-Za-z0-9]{5})(?:\.(local))?$/), inv = h.match(/^staff-([A-Za-z0-9_-]+)$/);
  if (inv) { // enlace de invitación del staff: queda conectado a GitHub y se quita el token de la dirección
    const ok = BQ.gh.acceptInvite(inv[1]); history.replaceState(null, '', location.pathname + location.search); BQ.E.boot({ invited: ok });
  }
  else if (m) BQ.P.boot(m[1], m[2] ? 'local' : 'supa');
  else if (/^(jugar|join|entrar|j)$/i.test(h)) BQ.P.boot('', 'supa');
  else if (window.matchMedia('(max-width: 760px)').matches && !BQ.store.get('quizzes', []).length) chooser();
  else BQ.E.boot();
  window.addEventListener('hashchange', () => location.reload());

  // móvil sin código: lo normal es que sea un jugador que ha escrito la dirección a mano
  function chooser() {
    document.getElementById('app').innerHTML = `<div class="pl"><div class="pbar"><span class="brand">Bascat<span>Quiz</span></span></div><div class="pbody"><div class="center">
      <h1>BascatQuiz</h1><div class="sub">Clips de partido, preguntes i rànquing en directe</div>
      <button class="pbtn" id="cJ" style="width:min(420px,100%)">Entrar a una partida</button>
      <button class="pbtn ghost" id="cS">Sóc del staff: preparar un qüestionari</button></div></div></div>`;
    document.getElementById('cJ').onclick = () => BQ.P.boot('', 'supa');
    document.getElementById('cS').onclick = () => BQ.E.boot();
  }
})();
</script>
